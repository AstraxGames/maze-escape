<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            background: #050505; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
        }
        .spinner { 
            width: 40px; 
            height: 40px; 
            border: 4px solid #1f1f23; 
            border-top: 4px solid #0ea5e9; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { margin-top: 20px; letter-spacing: 4px; text-transform: uppercase; font-size: 1.2rem; font-weight: 900; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>MAZE ESCAPE LOADING...</h1>
</body>
</html>
